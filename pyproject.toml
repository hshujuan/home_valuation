[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-valuation-lab"
version = "0.1.0"
description = "Synthetic home valuation, causal pricing, and inventory-profit laboratory"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
  "linearmodels>=6,<8",
  "matplotlib>=3.8,<4",
  "plotly>=5.24,<7",
  "threadpoolctl>=3.1,<4",
]

[project.optional-dependencies]
demo = ["streamlit>=1.40,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
report = [
  "pypandoc-binary>=1.15,<2",
  "typst>=0.13,<1",
  "PyMuPDF>=1.25,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
