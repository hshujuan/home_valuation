name: Synthetic study
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src examples app tests scripts
      - run: python -m pytest -q
      - run: python -m home_valuation pipeline --size 600 --bootstrap 0 --monte-carlo 0 --output outputs\ci
      - run: python -m home_valuation two-sided --size 2400 --output outputs\ci-two-sided
